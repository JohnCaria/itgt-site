name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload site (add/update only, never deletes)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_USER" && test -n "$FTP_PASSWORD" || { echo "FTP_USER / FTP_PASSWORD secrets are missing"; exit 1; }
          lftp -u "$FTP_USER,$FTP_PASSWORD" ftp.itgovernanceturkey.com <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          cd public_html || cd domains/itgovernanceturkey.com/public_html
          pwd
          # safety check: we must be in the WordPress web root before uploading anything
          cls -1 wp-config.php
          mirror -R --verbose --parallel=4 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md ./ ./
          bye
          LFTP
